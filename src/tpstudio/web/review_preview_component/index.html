<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 760px; display: block; background: white; }
  </style>
</head>
<body>
  <iframe id="preview" title="Copie corrigée"></iframe>
  <script>
    const preview = document.getElementById("preview");
    let selected = null;
    let scrollRequest = null;
    let lastScrollSequence = null;
    let pendingScrollTop = null;

    function isTextEntry(target) {
      if (!target) return false;
      const tag = (target.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || target.isContentEditable;
    }

    function handleKeyboardShortcut(event) {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
      if (isTextEntry(event.target)) return;
      const actions = {
        Enter: "validate",
        ArrowUp: "better",
        ArrowDown: "worse",
        ArrowLeft: "previous",
        ArrowRight: "next",
      };
      const action = actions[event.key];
      if (!action) return;
      event.preventDefault();
      send("streamlit:setComponentValue", {
        value: {
          keyboard_action: action,
          event_id: `${Date.now()}-${Math.random()}`,
        },
        dataType: "json",
      });
    }

    document.addEventListener("keydown", handleKeyboardShortcut);
    try {
      const parentDocument = window.parent.document;
      if (window.parent.__tpstudioReviewKeyboardHandler) {
        parentDocument.removeEventListener(
          "keydown", window.parent.__tpstudioReviewKeyboardHandler
        );
      }
      window.parent.__tpstudioReviewKeyboardHandler = handleKeyboardShortcut;
      parentDocument.addEventListener("keydown", handleKeyboardShortcut);
    } catch (_) {
      // The preview listener below still provides shortcuts inside the notebook.
    }

    function send(type, payload = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...payload,
      }, "*");
    }

    function focusSelected(shouldScroll = false) {
      const doc = preview.contentDocument;
      if (!doc) return;
      doc.querySelectorAll(".tpstudio-review-focus").forEach(
        element => element.classList.remove("tpstudio-review-focus")
      );
      if (!selected) {
        return;
      }
      const target = doc.getElementById(selected);
      if (target) {
        target.classList.add("tpstudio-review-focus");
        if (shouldScroll) {
          target.scrollIntoView({behavior: "auto", block: "center"});
        }
      }
    }

    function makeNotebookResponsive(doc) {
      const style = doc.createElement("style");
      style.id = "tpstudio-responsive-preview";
      style.textContent = `
        html, body {
          width: 100% !important;
          min-width: 0 !important;
          max-width: 100% !important;
          overflow-x: hidden !important;
        }
        .jp-Notebook, .jp-NotebookPanel-notebook, main {
          box-sizing: border-box !important;
          width: 100% !important;
          min-width: 0 !important;
          max-width: 100% !important;
          padding-left: 12px !important;
          padding-right: 12px !important;
        }
        .jp-Cell, .jp-Cell-inputWrapper, .jp-Cell-outputWrapper,
        .jp-InputArea, .jp-OutputArea, .jp-RenderedHTMLCommon {
          box-sizing: border-box !important;
          min-width: 0 !important;
          max-width: 100% !important;
        }
        .jp-RenderedHTMLCommon p, .jp-RenderedHTMLCommon li,
        .jp-RenderedHTMLCommon div, .tpstudio-annotation {
          overflow-wrap: anywhere !important;
          word-break: normal !important;
        }
        .jp-InputArea-editor, .jp-OutputArea-output pre,
        .highlight pre, pre {
          box-sizing: border-box !important;
          max-width: 100% !important;
          white-space: pre-wrap !important;
          overflow-wrap: anywhere !important;
        }
        img, svg, canvas {
          height: auto !important;
          max-width: 100% !important;
        }
        table {
          display: block !important;
          max-width: 100% !important;
          overflow-x: auto !important;
        }
      `;
      const previous = doc.getElementById(style.id);
      if (previous) previous.remove();
      (doc.head || doc.documentElement).appendChild(style);
    }

    function consumeScrollRequest() {
      if (
        !scrollRequest ||
        !scrollRequest.sequence ||
        scrollRequest.annotation_id !== selected ||
        scrollRequest.sequence === lastScrollSequence
      ) return false;
      lastScrollSequence = scrollRequest.sequence;
      return true;
    }

    preview.addEventListener("load", () => {
      const doc = preview.contentDocument;
      if (!doc) return;
      makeNotebookResponsive(doc);
      doc.addEventListener("keydown", handleKeyboardShortcut);
      doc.querySelectorAll(".tpstudio-annotation, .tpstudio-summary-item").forEach(
        element => {
          element.style.cursor = "pointer";
          element.title = "Sélectionner ce commentaire dans TPStudio";
          element.addEventListener("click", event => {
            event.preventDefault();
            selected = element.id;
            focusSelected();
            send("streamlit:setComponentValue", {
              value: {
                annotation_id: selected,
                event_id: `${Date.now()}-${Math.random()}`,
              },
              dataType: "json",
            });
          });
        }
      );
      const explicitScroll = consumeScrollRequest();
      focusSelected(explicitScroll);
      if (!explicitScroll && pendingScrollTop !== null) {
        const scrollTop = pendingScrollTop;
        pendingScrollTop = null;
        requestAnimationFrame(() => {
          preview.contentWindow.scrollTo({top: scrollTop, behavior: "auto"});
        });
      }
    });

    window.addEventListener("message", event => {
      if (event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      selected = args.selected || null;
      scrollRequest = args.scroll_request || null;
      if (preview.srcdoc !== args.html) {
        pendingScrollTop = preview.contentWindow
          ? preview.contentWindow.scrollY
          : null;
        preview.srcdoc = args.html || "";
      } else {
        focusSelected(consumeScrollRequest());
      }
      send("streamlit:setFrameHeight", {height: 760});
    });

    send("streamlit:componentReady", {apiVersion: 1});
    send("streamlit:setFrameHeight", {height: 760});
  </script>
</body>
</html>
