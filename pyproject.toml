[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpstudio"
version = "0.2.0"
description = "Outils de génération et correction de TP de physique en CPGE."
requires-python = ">=3.10"
dependencies = ["streamlit>=1.45,<2"]

[project.scripts]
tpstudio = "tpstudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
